name: Linux CLI

on:
  push:
    branches: [main, 'codex/**']
    paths: ['linux/**', 'docs/**', 'README.md', '.github/workflows/linux-cli.yml']
  pull_request:
    paths: ['linux/**', 'docs/**', 'README.md', '.github/workflows/linux-cli.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install system requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core pipx
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Check installed commands outside the source directory
        working-directory: ${{ runner.temp }}
        run: |
          thumb-it --help
          thumb-it --version
          thumb-it doctor
      - name: Run tests against the installed wheel (real FFmpeg end-to-end runs included)
        env:
          REQUIRE_FFMPEG: '1'
          REQUIRE_GUI_TESTS: '1'
          THUMB_IT_REPO: ${{ github.workspace }}
        run: |
          # Run from a copy outside linux/ so the tests import the installed wheel, not the source tree.
          rm -rf "$RUNNER_TEMP/tests" && cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -c "import thumb_it; print(thumb_it.__file__); assert 'site-packages' in thumb_it.__file__"
          python -m unittest discover -s tests -v
      - name: Exercise the minimum supported Pillow version
        if: matrix.python == '3.10'
        env:
          REQUIRE_FFMPEG: '1'
          REQUIRE_GUI_TESTS: '1'
          THUMB_IT_REPO: ${{ github.workspace }}
        run: |
          python -m pip install Pillow==10.4.0
          thumb-it doctor
          cd "$RUNNER_TEMP"
          python -m unittest discover -s tests -v
      - name: Verify README pipx installation
        run: |
          # Hosted runners override pipx's directories. Exercise a normal apt
          # installation with the default per-user paths used in the README.
          unset PIPX_HOME PIPX_BIN_DIR
          /usr/bin/pipx install .
          "$HOME/.local/bin/thumb-it" doctor
          /usr/bin/pipx uninstall pumpkins-thumb-it
      - name: Save distributable package
        if: success() && matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: thumb-it-wheel
          retention-days: 7
          path: linux/dist/

  debian:
    name: Debian 12 / Python 3.11
    runs-on: ubuntu-24.04
    container: python:3.11-slim-bookworm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system requirements
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Check installed command outside the checkout
        working-directory: /tmp
        run: thumb-it doctor
      - name: Run tests against the installed wheel (real FFmpeg end-to-end runs included)
        env:
          REQUIRE_FFMPEG: '1'
          REQUIRE_GUI_TESTS: '1'
          THUMB_IT_REPO: ${{ github.workspace }}
        run: |
          rm -rf /tmp/tests && cp -r tests /tmp/tests
          cd /tmp
          python -c "import thumb_it; print(thumb_it.__file__); assert 'site-packages' in thumb_it.__file__"
          python -m unittest discover -s tests -v
